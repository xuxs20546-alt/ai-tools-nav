<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex"><title>蜂巢后台</title><link rel="icon" href="/favicon.svg"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Noto Sans SC",sans-serif;background:#0a0806;color:#faf6f0}
.login{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login>div{background:#120e0a;border:1px solid #2a2218;border-radius:16px;padding:40px;max-width:400px;width:100%;text-align:center}
.login h1{font-size:24px;color:#f0a830;margin-bottom:16px}
.login input{width:100%;padding:12px;background:#1a1510;border:1px solid #2a2218;border-radius:50px;color:#fff;font-size:14px;margin-bottom:12px;outline:none}
.login input:focus{border-color:#f0a830}
.login button{width:100%;padding:12px;background:#f0a830;color:#1a1000;border:none;border-radius:50px;font-weight:700;font-size:15px;cursor:pointer}
.login .info{font-size:12px;color:#706858;margin-top:12px}
.admin{display:none;min-height:100vh}
.admin.active{display:flex}
.nav{width:200px;background:#120e0a;border-right:1px solid #2a2218;padding:20px 0;position:fixed;top:0;left:0;bottom:0}
.nav h2{padding:0 20px 16px;border-bottom:1px solid #2a2218;margin-bottom:12px;font-size:16px;color:#f0a830}
.nav a{display:block;padding:10px 20px;font-size:14px;color:#c4b8a4;text-decoration:none;cursor:pointer}.nav a:hover,.nav a.on{background:#1a1510;color:#f0a830}
.main{margin-left:200px;padding:24px;flex:1}
.main h3{font-size:18px;margin-bottom:16px}
.card{background:#120e0a;border:1px solid #2a2218;border-radius:10px;padding:16px;margin-bottom:12px}
.card h4{font-size:14px;margin-bottom:4px}
.card p{font-size:12px;color:#706858;margin-bottom:8px}
.card .row{display:flex;gap:8px;align-items:center}
.card input,.card select{background:#1a1510;border:1px solid #2a2218;color:#fff;padding:8px;border-radius:6px;font-size:13px}
.card button{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.badd{background:rgba(52,211,153,.15);color:#34d399}
.bsave{background:#f0a830;color:#1a1000}
.bdel{background:rgba(248,113,113,.15);color:#f87171}
.msg{position:fixed;top:16px;right:16px;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:999}
.msg.ok{background:#34d399;color:#0a0806}
.msg.err{background:#f87171;color:#fff}
.stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stats>div{background:#120e0a;border:1px solid #2a2218;border-radius:10px;padding:14px 20px;min-width:120px}
.stats .n{font-size:24px;font-weight:800;color:#f0a830}
.stats .l{font-size:12px;color:#706858}
#commitBtn{position:fixed;bottom:20px;right:20px;padding:12px 24px;background:#34d399;color:#0a0806;border:none;border-radius:30px;font-weight:700;font-size:14px;cursor:pointer;z-index:99;box-shadow:0 4px 20px rgba(52,211,153,.3)}
</style></head>
<body>
<div class="login" id="login">
<div><h1>🐝 蜂巢后台</h1><input type="password" id="pw" placeholder="管理密码" onkeydown="if(event.key==='Enter')go()"><button onclick="go()">登录</button><div class="info">密码: admin888</div></div>
</div>
<div class="admin" id="admin">
<div class="nav"><h2>🐝 蜂巢</h2><a class="on" onclick="tab('tools')">🛠 工具</a><a onclick="tab('blog')">📝 文章</a><a onclick="tab('daily')">📰 日报</a><a onclick="tab('misc')">⚙ 设置</a></div>
<div class="main" id="main"></div>
</div>
<button id="commitBtn" onclick="commit()" style="display:none">💾 提交到 GitHub</button>
<script>
// ── State ──
let TOKEN='',tools=[],articles=[],pending=new Set(),changed=false;
// ── API ──
async function gh(p){const r=await fetch('https://api.github.com/repos/xuxs20546-alt/ai-tools-nav'+p,{headers:{Authorization:'Bearer '+TOKEN,Accept:'application/vnd.github+json'}});if(!r.ok)throw Error(await r.text());return r.json()}
async function getFile(p){const d=await gh('/contents/'+p);return atob(d.content)}
async function putFile(p,content,msg){try{const e=await gh('/contents/'+p).catch(()=>null);const b={message:msg,content:btoa(unescape(encodeURIComponent(content)))};if(e)b.sha=e.sha;await fetch('https://api.github.com/repos/xuxs20546-alt/ai-tools-nav/contents/'+p,{method:'PUT',headers:{Authorization:'Bearer '+TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(b)});pending.add(p);changed=true;document.getElementById('commitBtn').style.display='block';return true}catch(e){toast('保存失败: '+e.message,'err');return false}}
function toast(m,t){const el=document.createElement('div');el.className='msg '+(t||'ok');el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),2500)}
// ── Login ──
function go(){var p=document.getElementById('pw').value;if(p!=='admin888'&&p!==localStorage.getItem('hpwd'))return toast('密码错误','err');localStorage.setItem('hpwd',p);TOKEN=localStorage.getItem('htok');if(!TOKEN){var t=prompt('首次使用，请输入GitHub Token (ghp_开头):');if(!t||!t.startsWith('ghp_'))return toast('Token格式错误','err');localStorage.setItem('htok',t);TOKEN=t}document.getElementById('login').style.display='none';document.getElementById('admin').classList.add('active');load().then(()=>tab('tools'))}
// ── Load ──
async function load(){var idx=await getFile('index.html');var m=idx.match(/<script type="application\/json" id="tools-data">([\s\S]*?)<\/script>/);tools=m?JSON.parse(m[1]):[];var bl=await getFile('blog.html');var am=bl.match(/const articles=\[([\s\S]*?)\];/);articles=am?new Function('return ['+am[1]+']')():[]}
// ── Tabs ──
function tab(t){document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('on'));event.target.classList.add('on');var m=document.getElementById('main');if(t==='tools')renderTools();else if(t==='blog')renderBlog();else if(t==='daily')tabDaily();else if(t==='misc')tabMisc()}
// ── Tools ──
function renderTools(){var h='<h3>🛠 工具管理 ('+tools.length+')</h3><div class="stats"><div><div class="n">'+tools.length+'</div><div class="l">工具总数</div></div></div><button class="badd" onclick="addTool()" style="margin-bottom:12px">+ 添加工具</button>';tools.forEach(function(t,i){h+='<div class="card"><h4>'+t.icon+' '+t.name+'</h4><p>'+t.cat+' | 热度:'+t.views+' | 标签:'+(t.tags||[]).join(',')+'</p><button class="badd" onclick="editTool('+i+')">编辑</button> <button class="bdel" onclick="delTool('+i+')">删除</button></div>'});document.getElementById('main').innerHTML=h}
function addTool(){var n=prompt('工具名称:');if(!n)return;tools.push({name:n,url:'',desc:'',cat:'chat',icon:'🤖',color:'#7c6aef',tags:['free'],views:'100万',features:['AI工具']});pending.add('index.html');changed=true;document.getElementById('commitBtn').style.display='block';renderTools()}
function editTool(i){var t=tools[i];var v=prompt('编辑 (名称||URL||描述||分类||图标):',[t.name,t.url,t.desc,t.cat,t.icon].join('||'));if(!v)return;var p=v.split('||');t.name=p[0]||t.name;t.url=p[1]||t.url;t.desc=p[2]||t.desc;t.cat=p[3]||t.cat;t.icon=p[4]||t.icon;pending.add('index.html');changed=true;document.getElementById('commitBtn').style.display='block';renderTools()}
function delTool(i){if(!confirm('删除 '+tools[i].name+'?'))return;tools.splice(i,1);pending.add('index.html');changed=true;document.getElementById('commitBtn').style.display='block';renderTools()}
// ── Blog ──
function renderBlog(){var h='<h3>📝 文章管理 ('+articles.length+')</h3><button class="badd" onclick="addArticle()" style="margin-bottom:12px">+ 写文章</button>';articles.forEach(function(a,i){h+='<div class="card"><h4>'+a.title+'</h4><p>'+a.tag+' | '+a.date+' | '+a.slug+'</p></div>'});document.getElementById('main').innerHTML=h}
function addArticle(){var t=prompt('文章标题:');if(!t)return;var slug='article-'+Date.now();articles.unshift({slug:slug,title:t,tag:'教程',emoji:'📝',date:new Date().toISOString().substring(0,10),readTime:8,keywords:t,excerpt:'',content:'<p>内容待补充</p>'});pending.add('blog.html');changed=true;document.getElementById('commitBtn').style.display='block';renderBlog()}
// ── Daily tab ──
function tabDaily(){document.getElementById('main').innerHTML='<h3>📰 日报管理</h3><p style="color:#706858">日报条目通过每日自动更新维护，后台暂不支持直接编辑。如需修改，请编辑 daily.html 文件。</p>'}
// ── Misc ──
function tabMisc(){document.getElementById('main').innerHTML='<h3>⚙ 设置</h3><div class="card"><h4>修改密码</h4><div class="row"><input id="np" placeholder="新密码"><button class="bsave" onclick="var n=document.getElementById("np").value;if(n){localStorage.setItem("hpwd",n);toast("密码已修改")}">保存</button></div></div><div class="card"><h4>退出登录</h4><button class="bdel" onclick="localStorage.clear();location.reload()">退出</button></div>'}
// ── Commit ──
async function commit(){if(pending.size===0)return toast('没有待提交更改','err');var msg=prompt('提交信息:','后台更新');if(!msg)return;for(var f of pending){var content='';if(f==='index.html'){content=await getFile('index.html');var toolsJSON=JSON.stringify(tools,null,2);content=content.replace(/<script type="application\/json" id="tools-data">[\s\S]*?<\/script>/,'<script type="application/json" id="tools-data">'+toolsJSON+'\n<\/script>')}else if(f==='blog.html'){content=await getFile('blog.html');var artJS='[\n  '+articles.map(function(a){return JSON.stringify(a)}).join(',\n  ')+'\n]';content=content.replace(/const articles=\[[\s\S]*?\];/,'const articles='+artJS+';')}await putFile(f,content||f,msg)}pending.clear();changed=false;document.getElementById('commitBtn').style.display='none';toast('✅ 已提交，Vercel 自动部署中')}
// ── Boot ──
</script>
</body>
</html>
