<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - 页面未找到 | 蜂巢 AI</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0806;color:#faf6f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
.wrap{max-width:500px}
.hex{width:80px;height:92px;margin:0 auto 24px;background:linear-gradient(135deg,#f0a830,#b8781a);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-size:36px}
h1{font-size:64px;font-weight:900;background:linear-gradient(135deg,#f0a830,#ffd480);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
p{font-size:16px;color:#c4b8a4;margin-bottom:8px;line-height:1.6}
.sub{font-size:14px;color:#706858;margin-bottom:32px}
.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#f0a830,#e8942a);color:#1a1000;border-radius:50px;font-weight:700;text-decoration:none;font-size:15px;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(240,168,48,.4)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hex">🐝</div>
  <h1>404</h1>
  <p>这只蜜蜂迷路了</p>
  <p class="sub">This bee got lost. The page you're looking for doesn't exist.</p>
  <a href="/" class="btn">← 回到蜂巢 · Back to Hive</a>
</div>
</body>
</html>
