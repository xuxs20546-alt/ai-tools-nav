let showCount=12, currentTag='all';

const tagColors={'教程':'#6c5ce7','评测':'#00b894','对比':'#0984e3','行业':'#e17055','技巧':'#fdcb6e','入门':'#a29bfe','赚钱':'#ff6b6b','免费':'#00cec9','榜单':'#e84393','趋势':'#fd79a8'};

function renderTags(){
  const allTags=['all',...new Set(articles.map(a=>a.tag))];
  document.getElementById('blogTags').innerHTML=allTags.map(t=>`<span class="blog-tag${currentTag===t?' active':''}" onclick="setTag('${t}')">${t==='all'?'全部':t}</span>`).join('');
}

function getFiltered(){
  let list=articles;
  if(currentTag!=='all') list=list.filter(a=>a.tag===currentTag);
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  if(q) list=list.filter(a=>a.title.toLowerCase().includes(q)||a.excerpt.toLowerCase().includes(q)||a.keywords.toLowerCase().includes(q));
  return list;
}

function renderArticles(){
  const filtered=getFiltered();
  const shown=filtered.slice(0,showCount);
  document.getElementById('articleGrid').innerHTML=shown.map(a=>{
    const color=tagColors[a.tag]||'#6c5ce7';
    return`<a href="blog-${a.slug}.html" class="article-card">
      <div class="article-img" style="background:linear-gradient(135deg,${color}15,${color}05)">${a.emoji}</div>
      <div class="article-body">
        <div class="article-meta"><span class="tag" style="background:${color}18;color:${color}">${a.tag}</span><span>${a.date}</span><span>·</span><span>${a.readTime} 分钟阅读</span></div>
        <div class="article-title">${a.title}</div>
        <div class="article-excerpt">${a.excerpt}</div>
      </div>
    </a>`;
  }).join('');
  const more=filtered.length>showCount;
  document.getElementById('loadMore').innerHTML=more?`<button onclick="showCount+=12;renderArticles()">加载更多 (还有 ${filtered.length-showCount} 篇)</button>`:`<p style="color:var(--text3);font-size:13px">共 ${filtered.length} 篇文章</p>`;
}

function setTag(t){currentTag=t;showCount=12;renderTags();renderArticles()}
function filterArticles(){showCount=12;renderArticles()}
function clearSearch(){document.getElementById('searchInput').value='';renderArticles()}

renderTags();renderArticles();
</script>
