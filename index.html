<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI工具导航 - 发现最好用的AI工具</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22222f;
    --text:#e8e8ed;--text2:#8888a0;--text3:#555568;
    --accent:#6c5ce7;--accent2:#a29bfe;--accent-glow:rgba(108,92,231,.25);
    --border:#2a2a3a;--radius:12px;--radius-sm:8px;
    --ad-bg:#161622;--ad-border:#2a2a44;
  }
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
  a{color:inherit;text-decoration:none}

  /* ── Header ── */
  .header{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px}
  .header-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;height:64px;gap:24px}
  .logo{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .logo span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .logo-icon{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;-webkit-text-fill-color:#fff}
  .search-box{flex:1;max-width:520px;position:relative}
  .search-box input{width:100%;height:40px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:0 16px 0 42px;color:var(--text);font-size:14px;outline:none;transition:.2s}
  .search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .search-box input::placeholder{color:var(--text3)}
  .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px}
  .header-right{display:flex;align-items:center;gap:16px;margin-left:auto}
  .btn-submit{padding:8px 20px;background:linear-gradient(135deg,var(--accent),#8b7cf8);border:none;border-radius:20px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
  .btn-submit:hover{opacity:.85;transform:translateY(-1px)}

  /* ── Hero Banner (Ad Spot) ── */
  .hero-ad{max-width:1280px;margin:24px auto 0;padding:0 24px}
  .ad-banner{width:100%;height:120px;background:var(--ad-bg);border:1px dashed var(--ad-border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:14px;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
  .ad-banner:hover{border-color:var(--accent);color:var(--text2)}
  .ad-banner::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(108,92,231,.05),rgba(162,155,254,.05))}

  /* ── Category Tabs ── */
  .categories{max-width:1280px;margin:28px auto 0;padding:0 24px;display:flex;gap:8px;flex-wrap:wrap}
  .cat-tab{padding:8px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;font-size:13px;color:var(--text2);cursor:pointer;transition:.2s;white-space:nowrap;user-select:none}
  .cat-tab:hover{color:var(--text);border-color:var(--text3)}
  .cat-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ── Main Grid ── */
  .main{max-width:1280px;margin:24px auto 0;padding:0 24px 60px;display:grid;grid-template-columns:1fr 300px;gap:24px}
  @media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{display:none}}

  /* ── Tool Cards ── */
  .section-title{font-size:18px;font-weight:700;margin:28px 0 16px;display:flex;align-items:center;gap:8px}
  .section-title .emoji{font-size:20px}
  .tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .tool-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.25s;position:relative;display:flex;flex-direction:column;gap:10px}
  .tool-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .tool-card-head{display:flex;align-items:center;gap:12px}
  .tool-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .tool-info{flex:1;min-width:0}
  .tool-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
  .tool-tag{font-size:10px;padding:2px 7px;background:rgba(108,92,231,.15);color:var(--accent2);border-radius:10px;font-weight:500}
  .tool-tag.hot{background:rgba(255,107,107,.15);color:#ff6b6b}
  .tool-tag.new{background:rgba(0,206,209,.15);color:#00ced1}
  .tool-url{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tool-desc{font-size:13px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tool-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
  .tool-meta{display:flex;gap:12px;font-size:11px;color:var(--text3)}
  .tool-arrow{color:var(--text3);font-size:14px;transition:.2s}
  .tool-card:hover .tool-arrow{color:var(--accent);transform:translateX(3px)}

  /* ── Sidebar ── */
  .sidebar{display:flex;flex-direction:column;gap:20px}
  .sidebar-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
  .sidebar-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}
  .ad-placeholder{width:100%;min-height:200px;background:var(--ad-bg);border:1px dashed var(--ad-border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px;margin-bottom:10px;cursor:pointer;transition:.3s}
  .ad-placeholder:hover{border-color:var(--accent);color:var(--text2)}
  .hot-list{list-style:none}
  .hot-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2)}
  .hot-list li:last-child{border:none}
  .hot-rank{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
  .hot-rank.r1{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff}
  .hot-rank.r2{background:linear-gradient(135deg,#ffa502,#e67e22);color:#fff}
  .hot-rank.r3{background:linear-gradient(135deg,#7bed9f,#2ed573);color:#fff}
  .hot-rank.rn{background:var(--bg3);color:var(--text3)}

  /* ── Inline Ad in Grid ── */
  .tool-card.ad-card{background:var(--ad-bg);border-style:dashed;justify-content:center;min-height:140px}
  .tool-card.ad-card:hover{border-style:solid}

  /* ── Footer ── */
  .footer{text-align:center;padding:40px 24px;color:var(--text3);font-size:13px;border-top:1px solid var(--border)}
  .footer a{color:var(--accent2);margin:0 8px}

  /* ── Toast ── */
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--accent);color:#fff;padding:12px 28px;border-radius:20px;font-size:14px;opacity:0;transition:.4s;z-index:999;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ── Responsive ── */
  @media(max-width:640px){
    .header-inner{gap:12px}
    .search-box{max-width:none}
    .btn-submit{padding:6px 14px;font-size:12px}
    .tool-grid{grid-template-columns:1fr}
    .categories{gap:6px}
  }

  /* ── Submit Modal ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center}
  .modal-overlay.show{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:32px;width:90%;max-width:480px}
  .modal h2{font-size:18px;margin-bottom:20px}
  .modal label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;margin-top:14px}
  .modal input,.modal textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:14px;outline:none;font-family:inherit}
  .modal input:focus,.modal textarea:focus{border-color:var(--accent)}
  .modal textarea{resize:vertical;min-height:80px}
  .modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
  .modal-actions button{padding:8px 24px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.2s}
  .btn-cancel{background:var(--bg3);color:var(--text2)}
  .btn-cancel:hover{color:var(--text)}
  .btn-confirm{background:var(--accent);color:#fff}
  .btn-confirm:hover{opacity:.85}
</style>
</head>

// ── State ──
let currentCat = 'all';
let searchQuery = '';

// ── Render Categories ──
function renderCategories() {
  const el = document.getElementById('categories');
  el.innerHTML = categories.map(c =>
    `<div class="cat-tab${currentCat===c.id?' active':''}" data-id="${c.id}">${c.emoji} ${c.name}</div>`
  ).join('');
  el.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentCat = tab.dataset.id;
      renderCategories();
      renderContent();
    });
  });
}

// ── Render Content ──
function renderContent() {
  const el = document.getElementById('content');
  let filtered = tools.filter(t => {
    const catMatch = currentCat === 'all' || t.cat === currentCat;
    const searchMatch = !searchQuery ||
      t.name.toLowerCase().includes(searchQuery) ||
      t.desc.toLowerCase().includes(searchQuery) ||
      t.cat.toLowerCase().includes(searchQuery);
    return catMatch && searchMatch;
  });

  if (filtered.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:60px 0;color:var(--text3)">没有找到匹配的工具 😅</div>';
    return;
  }

  // Group by category
  const groups = {};
  filtered.forEach(t => {
    if (!groups[t.cat]) groups[t.cat] = [];
    groups[t.cat].push(t);
  });

  let html = '';
  let adInserted = false;
  const catsToShow = currentCat === 'all' ? categories.slice(1) : categories.filter(c => c.id === currentCat);

  catsToShow.forEach((cat, ci) => {
    const group = groups[cat.id];
    if (!group || group.length === 0) return;

    html += `<div class="section-title"><span class="emoji">${cat.emoji}</span>${cat.name}<span style="font-size:13px;color:var(--text3);font-weight:400;margin-left:auto">${group.length} 个工具</span></div>`;
    html += '<div class="tool-grid">';
    group.forEach((t, i) => {
      // Insert ad card every 6 tools
      if (i > 0 && i % 6 === 0 && !adInserted) {
        html += `<div class="tool-card ad-card" onclick="showToast('广告位招商中')"><div style="color:var(--text3)">📢 信息流广告位</div></div>`;
        adInserted = true;
      }
      const tagHtml = t.tags.map(tag => {
        const labels = { hot: '🔥 热门', new: '✨ 新上线' };
        return `<span class="tool-tag ${tag}">${labels[tag]}</span>`;
      }).join('');
      const bgStyle = t.colorBg ? `background:${t.colorBg}` : `background:${t.color}20`;
      html += `
        <a href="https://${t.url}" target="_blank" rel="noopener" class="tool-card">
          <div class="tool-card-head">
            <div class="tool-icon" style="${bgStyle};font-size:22px">${t.icon}</div>
            <div class="tool-info">
              <div class="tool-name">${t.name} ${tagHtml}</div>
              <div class="tool-url">${t.url}</div>
            </div>
          </div>
          <div class="tool-desc">${t.desc}</div>
          <div class="tool-footer">
            <div class="tool-meta"><span>👁 ${t.views}</span></div>
            <span class="tool-arrow">→</span>
          </div>
        </a>`;
    });
    html += '</div>';
  });

  el.innerHTML = html;
}

// ── Render Hot List ──
function renderHotList() {
  const sorted = [...tools].sort((a, b) => {
    const va = parseFloat(a.views);
    const vb = parseFloat(b.views);
    return vb - va;
  });
  const top = sorted.slice(0, 8);
  document.getElementById('hotList').innerHTML = top.map((t, i) => {
    const rankClass = i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : 'rn';
    return `<li><span class="hot-rank ${rankClass}">${i+1}</span><span>${t.icon} ${t.name}</span></li>`;
  }).join('');
}

// ── Search ──
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.toLowerCase().trim();
  renderContent();
});

// Ctrl+K
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

// ── Modal ──
function openModal() { document.getElementById('modal').classList.add('show'); }
function closeModal() { document.getElementById('modal').classList.remove('show'); }
function submitTool() { showToast('✅ 提交成功，感谢您的推荐！'); closeModal(); }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Init ──
renderCategories();
renderContent();
renderHotList();
</script>
